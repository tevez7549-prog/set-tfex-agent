name: vps-history-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4
      - name: Pull candles from Settrade sandbox
        shell: powershell
        env:
          SETTRADE_APP_ID: ${{ secrets.SETTRADE_APP_ID }}
          SETTRADE_APP_SECRET: ${{ secrets.SETTRADE_APP_SECRET }}
          PY: C:\Users\Administrator\AppData\Local\Programs\Python\Python312\python.exe
        run: |
          & $env:PY -m pip install -q settrade_v2
          & $env:PY vps/history_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: history
          path: out
  save:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: history
          path: results/vps_history
      - run: |
          git config user.name "scan-agent"; git config user.email "actions@users.noreply.github.com"
          git add results/vps_history; git commit -m "vps history test" || true
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

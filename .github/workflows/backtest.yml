name: backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backtest.py", "backtest_pit.py", "fetch_data.py", ".github/workflows/backtest.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download prices
        run: mkdir -p results && python fetch_data.py 2>&1 | tee results/fetch_log.txt
      - name: Backtest grid (search + validate)
        run: python backtest.py 2>&1 | tee results/backtest_log.txt
      - name: Open holdout for passers only
        run: python holdout.py 2>&1 | tee results/holdout_log.txt
      - name: Download all SET stocks (point-in-time universe)
        run: python fetch_universe.py 2>&1 | tee results/universe_log.txt
      - name: Momentum backtest, point-in-time top 100
        run: python backtest_pit.py 2>&1 | tee results/backtest_pit_log.txt
      - name: Open holdout (pit) for passers only
        run: python holdout.py _pit 2>&1 | tee results/holdout_pit_log.txt
      - name: Commit data and results
        if: always()
        run: |
          git config user.name "backtest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data results || true
          git commit -m "backtest results $(date -u +%F)" || echo "nothing to commit"
          git push
